# CausalBool — pytest and coverage configuration.
#
# AUDIT03-C. There was no pytest or coverage configuration anywhere at root, so
# "the tests pass" was a statement with no denominator: nobody knew which lines
# of the declared owners the 32 tests reached. Measured on 2026-09-04 it was 86%
# overall and 60% for src/description_lengths.py -- with the misses sitting
# exactly in the per-gate cost branches that carry the published D_formula.
#
# COVERAGE IS A FLOOR, NOT A GOAL. 100% of lines executed says nothing about
# whether the assertions are any good; the mutation harness
# (audit/AUDIT03_R2_collapse/mutation_harness.py) is what measures that. The
# threshold exists to stop an owner silently losing its tests, not to be admired.

# AUDIT04-E. `testpaths = tests/analysis` was the whole Python suite as far as
# any command in this repository was concerned, and the 24 TSK-...-Test.py files
# under tests/Bio, tests/Lev4-7 and tests/Nature were run by NOTHING. They were
# invisible twice over: the manifest scanned only *.m, and their names match
# neither `test_*.py` nor `*_test.py`, so pointing pytest straight at those
# directories still collected zero.
#
# `python_files` now admits the TSK naming, and testpaths names every directory
# holding a DECLARED test. WHICH of those files is collected is not decided
# here -- conftest.py reads tests/MUnit/MANIFEST.tsv and ignores everything not
# declared `test`, so membership has exactly one owner in both languages.
[pytest]
testpaths =
    tests/analysis
    tests/Bio
    tests/Lev4
    tests/Lev5
    tests/Lev6
    tests/Lev7
    tests/Nature
python_files =
    test_*.py
    *_test.py
    *-Test.py
addopts =
    --strict-markers
    --strict-config
    -ra
filterwarnings =
    ignore::DeprecationWarning:pkg_resources.*
    ignore::DeprecationWarning:pybdm.*

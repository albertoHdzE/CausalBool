# CausalBool — pytest and coverage configuration.
#
# AUDIT03-C. There was no pytest or coverage configuration anywhere at root, so
# "the tests pass" was a statement with no denominator: nobody knew which lines
# of the declared owners the 32 tests reached. Measured on 2026-09-04 it was 86%
# overall and 60% for src/description_lengths.py -- with the misses sitting
# exactly in the per-gate cost branches that carry the published D_formula.
#
# COVERAGE IS A FLOOR, NOT A GOAL. 100% of lines executed says nothing about
# whether the assertions are any good; the mutation harness
# (audit/AUDIT03_R2_collapse/mutation_harness.py) is what measures that. The
# threshold exists to stop an owner silently losing its tests, not to be admired.

[pytest]
testpaths = tests/analysis
addopts =
    --strict-markers
    --strict-config
    -ra
filterwarnings =
    ignore::DeprecationWarning:pkg_resources.*
    ignore::DeprecationWarning:pybdm.*

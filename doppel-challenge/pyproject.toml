[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "doppel-challenge"
version = "0.1.0"
description = "Exact and explicitly approximate Boolean-network repertoire laboratory"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]
native-complexity = ["pybdm==0.1.0"]
notebook = ["jupyterlab>=4", "nbconvert>=7", "numpy>=1.24", "pandas>=2", "matplotlib>=3.7", "pybdm==0.1.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

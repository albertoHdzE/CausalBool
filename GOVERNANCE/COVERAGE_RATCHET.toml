global_floor = 12.63
# Measured from pure tier: source venv/bin/activate && python -m pytest -q tests/analysis/
# --cov=src --cov-report=json (pure tier, no Wolfram kernel; AUDIT04-P4g).
# Includes 4 new contract tests for corpus parsers.
# The floor RATCHES: it may rise, never fall. A module whose coverage drops
# below its recorded floor is a regression (exit 1), even when global figure is fine.
# Date: 2026-09-05.
# AUDIT04 review: every floor here was seeded at full float precision
# (98.0952380952381, 86.79245283018868, ...). A floor at that precision is a
# TRIPWIRE, not a ratchet -- it fires on jitter nobody can act on. All floored
# DOWN to two decimals, which still catches a real regression.
#
# WHAT A FLOOR HERE MEANS, AS OF 2026-09-06. All four parser floors now rest on
# tests that BITE. Re-measured by planting the same three defects that used to
# leave the suite green, plus one more:
#   SBMLParser   truncated to a single node        -> RED (1 test)
#   GINMLParser  every edge dropped                -> RED (1 test)
#   LogicParser  input bit ordering reversed       -> RED (3 tests)
#   LogicParser  functional-mode NOT inverted      -> RED (1 test)
#   BNetParser   last node dropped                 -> RED (unchanged, already bit)
# Restored -> GREEN, with no diff left in src/.
#
# Two corrections were needed to get there, and both were errors in the earlier
# prescription rather than in the parsers:
#   * "make `>= 1` an exact count" was NOT enough. The SBML fixture held ONE
#     node, so `== 1` also survives truncation-to-one-node. The FIXTURE had to
#     grow first; assertions over a fixture that small cannot bite whatever they
#     say.
#   * "LogicParser needs an ASYMMETRIC gate" was wrong. Bit reversal keeps each
#     row internally consistent and only permutes row ORDER, and
#     classify_truth_table recomputes from the input columns it is handed, so the
#     label is invariant: 'A AND NOT B' reads CANALISING with and without the
#     defect. Only an ELEMENTWISE assertion on the input enumeration catches it.
#
# Earlier ratchet planting, still valid:
#   Skip DL tests -> RED (description_lengths measured: 0.00%, below floor).
#   Restore full suite -> GREEN. Aspirational global floor 99.99% -> RED.

# ONE FLOOR WENT DOWN, AND THAT IS DECLARED RATHER THAN ABSORBED (AUDIT04-D).
# src/integration/LogicParser.py: 77.92 -> 75.67. It is NOT a regression, and
# the absolute figures are why:
#
#            statements  covered  missing  percent
#   before          114       93       21    77.92
#   after           116       94       22    75.67
#
# COVERED LINES WENT UP, 93 -> 94. The module gained two statements when its
# private six-family catalogue was collapsed onto the owner, one of them the
# `raise FileNotFoundError` guard in the owner accessor, which is unreachable in
# a normal checkout. The percentage fell because the DENOMINATOR grew.
#
# The design point this exposes: a PERCENTAGE floor is not refactor-invariant, so
# a ratchet built on it can be lowered by an improvement and raised by deleting
# tested code. A covered-statement floor would be invariant under both. That is
# recorded as an open weakness of this file rather than fixed here, because
# changing the ratchet's unit is a governance change, not a tidy-up.

[module_floors]
"src/causalbool_paths.py" = 100.00
"src/description_lengths.py" = 98.09
"src/integration/BNetParser.py" = 86.79
"src/integration/GINMLParser.py" = 84.76
"src/integration/LogicParser.py" = 75.67
"src/integration/SBMLParser.py" = 57.19
"src/integration/bio_D_experiment.py" = 12.86
"src/integration/phase_transition_experiment.py" = 43.70

# CausalBool — lint configuration.
#
# AUDIT03-C. 370 Python files had never been linted. Enabling a full ruleset
# would bury real defects under thousands of style findings, so this starts at
# the pyflakes family ONLY -- the rules that catch bugs rather than opinions:
#
#   F821  undefined name          F401  unused import
#   F841  unused local variable   F811  redefinition of unused name
#   F632  `is` with a literal     F502/F522  bad format usage
#
# F821 is the class that would have caught `a, b = params["pair"]` -- a dead
# unpack that could only ever raise -- by machine, instead of by my reading it.
#
# Style rules (E/W) are enabled only once F is clean, and are out of scope for
# this pass. Widening the selection is a deliberate act, not a default.

target-version = "py313"
line-length = 100

exclude = [
    "venv", ".venv", "archive", "node_modules",
    "src/external/ccapi",      # vendored third party: a dependency boundary
    "imp-prices/vendor",       # vendored, pinned byte-identical
    "**/reference",            # the ORIGINAL AUTHORS' code in each replication
    "**/site-packages",
]

[lint]
# ENFORCED: the rules that catch bugs rather than opinions. All clean as of
# 2026-09-04, so CI can go red on a regression rather than on a backlog.
#
#   F821 undefined name        F811 redefinition of unused name
#   F632 `is` with a literal   F502/F522/F524 bad format usage
#   F702 misplaced control flow
#
# These found two real defects on their first run:
#   * src/integration/BulkScraper.py used `zipfile` and `io` without importing
#     them, so that branch could only ever raise NameError;
#   * audit/AUDIT02_Q1_reproducibility/sweep_jobs.py obtained its `run` helper by
#     exec-ing /tmp/q1_sweep.py, a temp file long gone -- an audit harness that
#     could not run at all, and would have reported WILL-NOT-RUN for every job.
#
# AUDIT03-C, second pass: F401, F541 and F841 are now ENFORCED as well. They
# were declared debt at 218/67/47 (a count which had itself drifted -- the real
# figures were 213/67/47). The debt was then triaged rather than deleted, which
# is what turned it into three scientific findings; see GOVERNANCE/VERIFICATION.md.
#
#   F541  67 -> 0 everywhere. All were stray f prefixes on literal headers.
#   F841  47 -> 0 in every production path.
#   F401 213 -> 0 in every production path (154 remain, all in the paths
#              exempted below by name).
#
# THIS IS THE RATCHET, and it matters more than any single fix. A NEW unused
# import or dropped local in src/, tools/, papers/ or index-deconvolution/src/
# now fails CI, so the debt cannot grow back while the historical records stay
# readable. Exemptions are per PATH with a stated reason, never a rule-level
# blanket ignore -- a blanket ignore is how 270 became 330 unnoticed.
select = ["F821", "F811", "F632", "F502", "F522", "F524", "F702",
          "F401", "F541", "F841"]

[lint.per-file-ignores]
# ── The declared F401/F841 exemptions, each with its reason ─────────────────
#
# Everything below is a DATED RECORD or a SEPARATELY PINNED ENVIRONMENT. Editing
# them would rewrite history rather than fix code, which is the project's
# standing archive policy (CLAUDE.md). They are listed by path so that adding a
# new one is a visible, reviewable act.
#
# The four replication packages carry their own venv, their own pinned
# requirements and their own suites (28/97/47/41). Their imports answer to those
# environments, not to this repository's lint.
"imp-causal-paper/**" = ["F401", "F841"]
"imp-causalNet-paper/**" = ["F401", "F841"]
"imp-pathinfo-paper/**" = ["F401", "F841"]
"imp-prices/**" = ["F401", "F841"]
# Each level* directory is a dated experiment record for the order-discovery
# programme; collapsing or tidying them rewrites the record.
"index-deconvolution/level*/**" = ["F401", "F841"]
"index-deconvolution/notebooks/**" = ["F401", "F841"]
"index-deconvolution/crosscheck/**" = ["F401", "F841"]
"index-deconvolution/experiments/**" = ["F401", "F841"]
# Frozen Level 8 reproducibility artefact.
"workspaces/**" = ["F401", "F841"]
# Provenance archives: doc/newIntPaper and doc/finalpaper (CLAUDE.md).
"doc/**" = ["F401", "F841"]
# One-off audit scripts, kept as the evidence for their own findings.
"audit/**" = ["F401", "F841"]
# Level 4-7 validation campaign runners, written per campaign.
"tests/Lev*/**" = ["F401", "F841"]
"tests/Bio/**" = ["F401", "F841"]
"tests/Nature/**" = ["F401", "F841"]
"experiments/**" = ["F401", "F841"]

# Star-imports in notebooks-turned-scripts would otherwise mask F401/F403.
"**/notebooks/*.py" = ["F403", "F405"]
# Re-importing in a later cell is a deliberate notebook idiom: cells are run
# independently and out of order, so a cell that assumes nothing about earlier
# state is MORE reproducible, not less. F811 is a defect in a module and a
# feature in a notebook.
"**/*.ipynb" = ["F811"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "imp-causalnet-paper"
version = "0.1.0"
description = "Replication of Zenil, Kiani, Zea & Tegner (2018), Algorithmic Causal Deconvolution of Intertwined Data and Networks by Generating Mechanism (arXiv:1802.09904v8), with a CausalBool index-set mirror"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pybdm==0.1.0",
  "setuptools<81",
  "numpy>=1.26",
  "networkx>=3.2",
  "matplotlib>=3.8",
  "scipy>=1.11",
  "pandas>=2.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "jupyter", "ipykernel"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::UserWarning"]

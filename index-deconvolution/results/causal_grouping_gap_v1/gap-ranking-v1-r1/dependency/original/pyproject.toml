[project]
name = "seqdecon"
version = "0.0.1"
description = "Retrieve a generating program for a numeric series by treating the OEIS as a library of generative models."
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1",
    "numpy>=2.0",
    "matplotlib>=3.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]
bdm = [
    "pybdm>=0.1",
    "setuptools<81",   # pybdm 0.1.0 imports pkg_resources, removed in setuptools 81+
]
notebooks = [
    "jupyter>=1.1",
    "nbformat>=5.10",
    "nbconvert>=7.16",
    "ipykernel>=6.29",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/seqdecon"]

[tool.ruff]
line-length = 96
src = ["src", "experiments", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
